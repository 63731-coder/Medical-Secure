services:
  # =========================
  # BACKEND DJANGO
  # =========================
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://medical_user:secure123@postgres:5432/medical_secure
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - ALLOWED_HOSTS=localhost,backend,nginx
    depends_on:
      - postgres
      - keycloak
    networks:
      - medical-network
    restart: unless-stopped

  # =========================
  # FRONTEND VUE.JS
  # =========================
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medical-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=https://localhost/api
      - VITE_KEYCLOAK_URL=https://localhost/auth
    networks:
      - medical-network
    restart: unless-stopped

  # =========================
  # DATABASES
  # =========================
  
  postgres:
    image: postgres:15
    container_name: medical-postgres
    environment:
      POSTGRES_DB: medical_secure
      POSTGRES_USER: medical_user
      POSTGRES_PASSWORD: secure123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medical-network
    restart: unless-stopped

  keycloak-db:
    image: postgres:15
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - medical-network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: medical-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
    ports:
      - "8080:8080"
    command: 
      - start-dev
      - --import-realm
    depends_on:
      - keycloak-db
    volumes:
      - ./keycloak-import:/opt/keycloak/data/import
    networks:
      - medical-network
    restart: unless-stopped

  # =========================
  # ELK STACK FOR LOGGING
  # =========================
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: medical-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - medical-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: medical-logstash
    volumes:
      - ./backend/logs:/usr/share/logstash/logs:ro
      - ./elk-config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
      - "9600:9600"
    networks:
      - medical-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: medical-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=medical-kibana
    ports:
      - "5601:5601"
    networks:
      - medical-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # =========================
  # NGINX REVERSE PROXY with TLS
  # =========================
  
  nginx:
    image: nginx:alpine
    container_name: medical-nginx
    ports:
      - "80:80"       # HTTP (redirection vers HTTPS)
      - "443:443"     # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/localhost.crt:/etc/nginx/ssl/localhost.crt:ro
      - ./certs/localhost.key:/etc/nginx/ssl/localhost.key:ro
    networks:
      - medical-network
    depends_on:
      - backend
      - frontend
      - keycloak
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  medical-network:
    driver: bridge

volumes:
  postgres_data:
  keycloak_db_data:
  elasticsearch_data:
