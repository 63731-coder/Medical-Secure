input {
  file {
    path => "/usr/share/logstash/logs/security.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    type => "security"
  }
  
  file {
    path => "/usr/share/logstash/logs/security_errors.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    type => "security_error"
  }
}

filter {
  # Parse timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
  
  # Add tags based on log level
  if [level] == "CRITICAL" or [level] == "ERROR" {
    mutate {
      add_tag => [ "alert" ]
    }
  }
  
  if [level] == "WARNING" {
    mutate {
      add_tag => [ "warning" ]
    }
  }
  
  # Extract IP address for geolocation
  if [details][ip_address] {
    geoip {
      source => "[details][ip_address]"
      target => "geoip"
    }
  }
  
  # Add indices based on action type
  if [action] =~ /unauthorized|failed|suspicious/ {
    mutate {
      add_tag => [ "security_incident" ]
    }
  }
}

output {
  if "security_incident" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "medsecure-security-incidents-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "medsecure-logs-%{+YYYY.MM.dd}"
    }
  }
  
  # Also output to stdout for debugging
  stdout {
    codec => rubydebug
  }
}
